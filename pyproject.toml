[project]
name = "real-estate-extract"
version = "0.1.0"
description = "Zillow real estate ETL pipeline for Las Vegas listings"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=1.10.0",
    "PyYAML>=6.0",
    "boto3==1.34.106",  # kept for future AWS S3 integration; currently unused
    "cryptography>=47.0.0",
]

# PEP 735 dependency groups — dev tools are not shipped with the package
[dependency-groups]
dev = [
    "black>=24.0.0",
    "isort>=5.0.0",
    "flake8>=5.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.black]
line-length = 127
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 127

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=etl --cov-report=term-missing"
