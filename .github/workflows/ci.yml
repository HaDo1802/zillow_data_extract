name: CI

on:
  push:
    branches: [main]
    paths:
      - "etl/**"
      - "dags/**"
      - "tests/**"
      - "utils/**"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-airflow.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "etl/**"
      - "dags/**"
      - "tests/**"
      - "utils/**"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-airflow.txt"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"

jobs:
  format-and-lint:
    name: Code Format & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Format code with Black
        run: uv run black etl/ tests/ --line-length 127

      - name: Sort imports with isort
        run: uv run isort etl/ tests/ --profile black

  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify district map exists
        run: |
          if [ ! -f "utils/district_map.csv" ]; then
            echo "Missing utils/district_map.csv"
            exit 1
          fi

      - name: Run unit tests
        run: uv run pytest tests/test_*.py -v

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [format-and-lint, unit-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/real-estate-etl:latest
            ${{ secrets.DOCKER_USERNAME }}/real-estate-etl:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
