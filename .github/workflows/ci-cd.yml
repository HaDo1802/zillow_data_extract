name: Real Estate ETL Pipeline CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "etl/**"
      - "dags/**"
      - "tests/**"
      - "utils/**"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-airflow.txt"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "etl/**"
      - "dags/**"
      - "tests/**"
      - "utils/**"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements-airflow.txt"
      - ".github/workflows/**"
  # workflow_dispatch has no path filter — manual runs always execute in full
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"

jobs:
  format-and-lint:
    name: Code Format & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Format code with Black
        run: uv run black etl/ tests/ --line-length 127

      - name: Sort imports with isort
        run: uv run isort etl/ tests/ --profile black

  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify district map exists
        run: |
          if [ ! -f "utils/district_map.csv" ]; then
            echo "Missing utils/district_map.csv"
            exit 1
          fi

      - name: Run unit tests
        run: uv run pytest tests/test_*.py -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [format-and-lint, unit-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USERNAME != '' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/real-estate-etl:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker-build]
    # Only deploy on main branch (not PRs). The SSH steps will fail with a clear error if EC2 secrets are not yet configured.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env from secret
        run: printf '%s' "${{ secrets.EC2_ENV_FILE }}" > .env

      - name: Copy .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env"
          target: "/home/ubuntu/real_estate_extract/"

      - name: Pull latest code and restart Airflow
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/real_estate_extract
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker compose ps
