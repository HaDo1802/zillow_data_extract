name: Real Estate ETL Pipeline CI/CD

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_full_pipeline:
        description: "Run full ETL pipeline (not just tests)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  PYTHON_VERSION: "3.9"

jobs:
  format-and-lint:
    name: Code Format & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install formatting tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format code with Black
        run: |
          echo "🎨 Formatting code with Black..."
          black etl/ tests/ --line-length 127

      - name: Sort imports with isort
        run: |
          echo "📦 Sorting imports..."
          isort etl/ tests/ --profile black

      # No flake8, no linting failures, no noise
      # No auto-commit (pre-commit handles formatting locally)

  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify district map exists
        run: |
          if [ ! -f "utils/district_map.csv" ]; then
            echo "❌ Missing utils/district_map.csv"
            exit 1
          fi

      - name: Run unit tests
        run: |
          pytest tests/test_*.py -v

      - name: Tests passed!
        run: echo "✅ All tests passed!"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [format-and-lint, unit-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USERNAME != '' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/real-estate-etl:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-etl-pipeline:
    runs-on: ubuntu-latest
    name: Execute Real Estate ETL Pipeline
    needs: [format-and-lint, unit-test, docker-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_pipeline == 'true'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directories
        run: |
          mkdir -p data/raw data/transformed etl_log
          chmod 777 data/raw data/transformed etl_log

      - name: Configure environment
        run: |
          # API Key (required for extract.py)
          echo "RAPID_API_KEY=${{ secrets.RAPID_API_KEY }}" > .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "SUPABASE_STORAGE_BUCKET=${{ secrets.SUPABASE_STORAGE_BUCKET }}" >> .env
          echo "SUPABASE_RAW_PREFIX=${{ secrets.SUPABASE_RAW_PREFIX }}" >> .env
          echo "SUPABASE_TRANSFORMED_PREFIX=${{ secrets.SUPABASE_TRANSFORMED_PREFIX }}" >> .env
          echo "✅ Environment configured for extraction + transform"

      - name: Step 1 - Extract Real Estate Data
        run: |
          echo "🕷️ Starting Zillow data extraction..."
          cd etl
          python extract.py
          echo "✅ Data extraction completed"

          if [ -f "../data/raw/raw_latest.csv" ]; then
            echo "📄 Raw data file created successfully"
            echo "Raw data rows: $(wc -l < ../data/raw/raw_latest.csv)"
          else
            echo "❌ Raw data file not found"
            exit 1
          fi

      - name: Step 2 - Transform and Clean Data
        run: |
          echo "🧹 Starting data transformation..."
          cd etl
          python transform.py
          echo "✅ Data transformation completed"

          if [ -f "../data/transformed/transformed_latest.csv" ]; then
            echo "📄 Transformed data file created successfully"
            echo "Transformed data rows: $(wc -l < ../data/transformed/transformed_latest.csv)"
          else
            echo "❌ Transformed data file not found"
            exit 1
          fi

      - name: Step 3 - Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_RAW_PREFIX: ${{ secrets.SUPABASE_RAW_PREFIX }}
          SUPABASE_TRANSFORMED_PREFIX: ${{ secrets.SUPABASE_TRANSFORMED_PREFIX }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_STORAGE_BUCKET" ]; then
            echo "❌ Missing required secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_STORAGE_BUCKET"
            exit 1
          fi

          echo "☁️ Uploading files to Supabase Storage bucket: ${SUPABASE_STORAGE_BUCKET}"
          export PYTHONPATH="${GITHUB_WORKSPACE}/etl:${GITHUB_WORKSPACE}:${PYTHONPATH}"
          python - <<'PY'
          import os
          from etl.load import load_files_to_supabase

          bucket = os.environ["SUPABASE_STORAGE_BUCKET"]
          raw_prefix = os.environ.get("SUPABASE_RAW_PREFIX", "raw")
          transformed_prefix = os.environ.get("SUPABASE_TRANSFORMED_PREFIX", "transformed")

          results = load_files_to_supabase(
              raw_file="data/raw/raw_latest.csv",
              transformed_file="data/transformed/transformed_latest.csv",
              bucket_name=bucket,
              raw_prefix=raw_prefix,
              transformed_prefix=transformed_prefix,
          )

          env_path = os.environ["GITHUB_ENV"]
          raw = results.get("raw")
          raw_latest_manifest = results.get("raw_latest_manifest")
          transformed = results.get("transformed")
          with open(env_path, "a", encoding="utf-8") as f:
              if raw:
                  f.write(f"RAW_SUPABASE_OBJECT_KEY={raw['object_key']}\n")
              if raw_latest_manifest:
                  f.write(f"RAW_LATEST_MANIFEST_OBJECT_KEY={raw_latest_manifest['object_key']}\n")
              if transformed:
                  f.write(f"TRANSFORMED_SUPABASE_OBJECT_KEY={transformed['object_key']}\n")
          PY
          echo "✅ Supabase Storage upload completed"

      - name: Verify Supabase Storage Upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
        run: |
          python - <<'PY'
          import os
          import requests

          base_url = os.environ["SUPABASE_URL"].rstrip("/")
          service_key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          bucket = os.environ["SUPABASE_STORAGE_BUCKET"]
          raw_key = os.environ["RAW_SUPABASE_OBJECT_KEY"]
          raw_latest_manifest_key = os.environ["RAW_LATEST_MANIFEST_OBJECT_KEY"]
          transformed_key = os.environ["TRANSFORMED_SUPABASE_OBJECT_KEY"]

          headers = {
              "apikey": service_key,
              "Authorization": f"Bearer {service_key}",
          }

          for key in (raw_key, raw_latest_manifest_key, transformed_key):
              url = f"{base_url}/storage/v1/object/info/{bucket}/{key}"
              r = requests.get(url, headers=headers, timeout=30)
              r.raise_for_status()
              print(f"✅ Verified: {bucket}/{key}")
          PY

      - name: Pipeline Summary
        env:
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
        run: |
          echo "🎉 Real Estate ETL Pipeline Completed Successfully!"
          echo "📅 Executed on: $(date)"
          echo "📊 Pipeline Summary:"
          echo "  ✅ Data Extraction (Zillow API)"
          echo "  ✅ Data Transformation"
          echo "  ✅ Supabase Storage Upload"

          echo ""
          echo "📦 Local Data Files:"
          ls -lh data/raw/raw_latest.csv 2>/dev/null || echo "  Raw data: Not found"
          ls -lh data/transformed/transformed_latest.csv 2>/dev/null || echo "  Transformed data: Not found"
          echo ""
          echo "☁️ Supabase Storage Objects:"
          echo "  ${SUPABASE_STORAGE_BUCKET}/${RAW_SUPABASE_OBJECT_KEY}"
          echo "  ${SUPABASE_STORAGE_BUCKET}/${RAW_LATEST_MANIFEST_OBJECT_KEY}"
          echo "  ${SUPABASE_STORAGE_BUCKET}/${TRANSFORMED_SUPABASE_OBJECT_KEY}"

      - name: Upload Data Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-estate-data-${{ github.run_number }}
          path: |
            data/raw/*.csv
            data/transformed/*.csv
            etl_log/*.txt
          retention-days: 30
